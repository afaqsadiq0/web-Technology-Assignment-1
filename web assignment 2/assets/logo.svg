<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="qmGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="qmAccent" x1="12" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="qmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#6366F1" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base Rounded Hexagon/Shield -->
  <rect x="4" y="4" width="40" height="40" rx="12" fill="url(#qmGrad)" filter="url(#qmGlow)"/>

  <!-- Academic Graduation Cap Top -->
  <path d="M24 14L36 20L24 26L12 20L24 14Z" fill="#FFFFFF" fill-opacity="0.95"/>
  <path d="M36 20V26" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <circle cx="36" cy="27" r="1.5" fill="#06B6D4"/>

  <!-- Cap Base & Neck -->
  <path d="M16 22.5V28C16 30.5 19.5 32 24 32C28.5 32 32 30.5 32 28V22.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

  <!-- Dynamic Sparkle / Check Accent -->
  <path d="M20 36.5L23 39.5L28.5 34" stroke="url(#qmAccent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
