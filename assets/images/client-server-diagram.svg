<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="400" rx="16" fill="url(#bgGrad)" />

  <!-- Subtitle / Title -->
  <text x="400" y="50" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="2">CSC336 WEB TECHNOLOGIES</text>
  <text x="400" y="80" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Client-Server Request-Response Lifecycle</text>

  <!-- Client Box -->
  <g transform="translate(60, 130)" filter="url(#shadow)">
    <rect width="220" height="180" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <rect width="220" height="35" rx="12" fill="#3b82f6" />
    <circle cx="20" cy="18" r="5" fill="#ef4444" />
    <circle cx="36" cy="18" r="5" fill="#f59e0b" />
    <circle cx="52" cy="18" r="5" fill="#10b981" />
    <text x="110" y="23" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Client (User Agent)</text>
    
    <text x="110" y="80" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="28">🖥️</text>
    <text x="110" y="115" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Web Browser</text>
    <text x="110" y="140" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">HTML5 / CSS3 / DOM</text>
  </g>

  <!-- Server Box -->
  <g transform="translate(520, 130)" filter="url(#shadow)">
    <rect width="220" height="180" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <rect width="220" height="35" rx="12" fill="#10b981" />
    <text x="110" y="23" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Web Server Host</text>
    
    <text x="110" y="80" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="28">🗄️</text>
    <text x="110" y="115" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Apache / Nginx</text>
    <text x="110" y="140" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">App Logic &amp; Database</text>
  </g>

  <!-- Request Arrow (Top) -->
  <g transform="translate(290, 170)">
    <path d="M 10 20 L 200 20" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4" />
    <polygon points="205,20 195,14 195,26" fill="#38bdf8" />
    <rect x="40" y="-2" width="140" height="24" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
    <text x="110" y="14" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">1. HTTP GET / Request</text>
  </g>

  <!-- Response Arrow (Bottom) -->
  <g transform="translate(290, 240)">
    <path d="M 210 20 L 20 20" stroke="#34d399" stroke-width="3" />
    <polygon points="15,20 25,14 25,26" fill="#34d399" />
    <rect x="40" y="-2" width="140" height="24" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="1" />
    <text x="110" y="14" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">2. HTTP 200 OK Response</text>
  </g>

  <text x="400" y="365" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">
    Muhammad Afaq (FA23-BSE-012) — COMSATS University Islamabad, Vehari Campus
  </text>
</svg>
